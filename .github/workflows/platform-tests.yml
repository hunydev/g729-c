name: platform-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM_BENCH_FRAMES: 2000

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: macos-arm64-clang
            runner: macos-15
            cc: clang
            cxx: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Capture platform
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          mkdir -p reports
          uname -s > "reports/${{ matrix.name }}.uname_s"
          uname -m > "reports/${{ matrix.name }}.uname_m"
          "$CC" --version | sed -n '1p' > "reports/${{ matrix.name }}.cc"
          "$CXX" --version | sed -n '1p' > "reports/${{ matrix.name }}.cxx"
          cmake --version | sed -n '1p' > "reports/${{ matrix.name }}.cmake"

      - name: Run platform check
        id: check
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -o pipefail
          {
            ./configure --prefix="$PWD/reports/make-install-${{ matrix.name }}" \
              --enable-shared \
              --disable-werror \
              --enable-tools \
              --disable-tests \
              --disable-examples
            make clean
            make platform-check PLATFORM_BENCH_FRAMES="$PLATFORM_BENCH_FRAMES"
            make install
            cmake -S . -B "build-cmake-${{ matrix.name }}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DG729_ENABLE_WERROR=ON
            cmake --build "build-cmake-${{ matrix.name }}"
            ctest --test-dir "build-cmake-${{ matrix.name }}" --output-on-failure
            cmake --install "build-cmake-${{ matrix.name }}" \
              --prefix "$PWD/reports/cmake-install-${{ matrix.name }}"
          } 2>&1 | tee "reports/${{ matrix.name }}.log"

      - name: Write Markdown report
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          outcome="${{ steps.check.outcome }}"
          {
            echo "# Platform Test: ${{ matrix.name }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Outcome | ${outcome} |"
            echo "| Runner | ${{ matrix.runner }} |"
            echo "| OS | $(cat "reports/${{ matrix.name }}.uname_s" 2>/dev/null || echo unknown) |"
            echo "| Arch | $(cat "reports/${{ matrix.name }}.uname_m" 2>/dev/null || echo unknown) |"
            echo "| CC | $(cat "reports/${{ matrix.name }}.cc" 2>/dev/null || echo unknown) |"
            echo "| CXX | $(cat "reports/${{ matrix.name }}.cxx" 2>/dev/null || echo unknown) |"
            echo "| CMake | $(cat "reports/${{ matrix.name }}.cmake" 2>/dev/null || echo unknown) |"
            echo "| Coverage | configure, make, make install, CMake, CTest |"
            echo
            echo "## Log Tail"
            echo
            echo '```text'
            tail -n 100 "reports/${{ matrix.name }}.log" 2>/dev/null || true
            echo '```'
          } > "reports/${{ matrix.name }}.md"
          cat "reports/${{ matrix.name }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload platform report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-report-${{ matrix.name }}
          path: reports/${{ matrix.name }}.*
          if-no-files-found: error

  docker:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64-docker-qemu
            platform: linux/arm64
            image: arm64v8/ubuntu:24.04
            qemu: arm64
          - name: linux-i386-docker
            platform: linux/386
            image: i386/ubuntu:24.04
            qemu: ""
    env:
      PLATFORM_BENCH_FRAMES: 1000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: ${{ matrix.qemu != '' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu }}

      - name: Run platform check in container
        id: check
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.name }}
        run: |
          mkdir -p reports
          set -o pipefail
          docker run --rm --platform "${{ matrix.platform }}" \
            -e PLATFORM_BENCH_FRAMES="$PLATFORM_BENCH_FRAMES" \
            -e TARGET_NAME="$TARGET_NAME" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake
              uname -s > "reports/${TARGET_NAME}.uname_s"
              uname -m > "reports/${TARGET_NAME}.uname_m"
              gcc --version | sed -n "1p" > "reports/${TARGET_NAME}.cc"
              g++ --version | sed -n "1p" > "reports/${TARGET_NAME}.cxx"
              cmake --version | sed -n "1p" > "reports/${TARGET_NAME}.cmake"
              ./configure --prefix="/workspace/reports/make-install-${TARGET_NAME}" \
                --enable-shared \
                --disable-werror \
                --enable-tools \
                --disable-tests \
                --disable-examples
              make clean
              make platform-check PLATFORM_BENCH_FRAMES="${PLATFORM_BENCH_FRAMES}" CC=gcc CXX=g++
              make install
              cmake -S . -B "build-cmake-${TARGET_NAME}" \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DG729_ENABLE_WERROR=ON
              cmake --build "build-cmake-${TARGET_NAME}"
              ctest --test-dir "build-cmake-${TARGET_NAME}" --output-on-failure
              cmake --install "build-cmake-${TARGET_NAME}" \
                --prefix "/workspace/reports/cmake-install-${TARGET_NAME}"
            ' 2>&1 | tee "reports/${TARGET_NAME}.log"

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: sudo chown -R "$USER:$USER" build build-cmake-* reports config.mk 2>/dev/null || true

      - name: Write Markdown report
        if: always()
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.name }}
        run: |
          mkdir -p reports
          outcome="${{ steps.check.outcome }}"
          {
            echo "# Platform Test: ${TARGET_NAME}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Outcome | ${outcome} |"
            echo "| Runner | ubuntu-24.04 |"
            echo "| Container | ${{ matrix.image }} |"
            echo "| Platform | ${{ matrix.platform }} |"
            echo "| OS | $(cat "reports/${TARGET_NAME}.uname_s" 2>/dev/null || echo unknown) |"
            echo "| Arch | $(cat "reports/${TARGET_NAME}.uname_m" 2>/dev/null || echo unknown) |"
            echo "| CC | $(cat "reports/${TARGET_NAME}.cc" 2>/dev/null || echo unknown) |"
            echo "| CXX | $(cat "reports/${TARGET_NAME}.cxx" 2>/dev/null || echo unknown) |"
            echo "| CMake | $(cat "reports/${TARGET_NAME}.cmake" 2>/dev/null || echo unknown) |"
            echo "| Coverage | configure, make, make install, CMake, CTest |"
            echo
            echo "## Log Tail"
            echo
            echo '```text'
            tail -n 100 "reports/${TARGET_NAME}.log" 2>/dev/null || true
            echo '```'
          } > "reports/${TARGET_NAME}.md"
          cat "reports/${TARGET_NAME}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload platform report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-report-${{ matrix.name }}
          path: reports/${{ matrix.name }}.*
          if-no-files-found: error

  report:
    name: platform-test-report
    runs-on: ubuntu-24.04
    needs:
      - native
      - docker
    if: always()
    steps:
      - name: Download platform reports
        uses: actions/download-artifact@v8
        with:
          pattern: platform-report-*
          path: platform-reports
          merge-multiple: true

      - name: Build combined Markdown report
        shell: bash
        run: |
          {
            echo "# Platform Test Report"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            for report in $(find platform-reports -name '*.md' -type f | sort); do
              cat "$report"
              echo
            done
          } > platform-test-report.md
          cat platform-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report
        uses: actions/upload-artifact@v7
        with:
          name: platform-test-report
          path: platform-test-report.md
          if-no-files-found: error
